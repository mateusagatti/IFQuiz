<!DOCTYPE html>

<title>IFQuiz | Simulados Escolares</title>
<style>
:root{--verde:#17823b;--escuro:#07552a;--claro:#e9f7ee;--vermelho:#c62828;--texto:#20312a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f7f4;color:var(--texto)}
header{background:linear-gradient(120deg,var(--escuro),var(--verde));color:white;padding:30px 18px;text-align:center;border-bottom:5px solid #d32f2f}
header h1{margin:0;font-size:2.5rem}header p{margin:8px 0 0}main{max-width:930px;margin:30px auto;padding:0 16px}.painel{background:white;border-radius:15px;padding:28px;box-shadow:0 5px 22px #143b2312}h2{color:var(--escuro)}.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:22px}
button{border:0;border-radius:9px;background:var(--verde);color:white;padding:14px 18px;font-size:1rem;cursor:pointer;font-weight:600}button:hover{background:var(--escuro)}.materia{min-height:90px}.subtitulo,.progresso{color:#597063}.barra{height:9px;border-radius:12px;background:#dce9e0;overflow:hidden;margin:12px 0 24px}.preenchimento{height:100%;background:var(--verde);transition:width .2s}.alternativa{display:block;width:100%;margin:10px 0;text-align:left;background:#f1f7f3;color:var(--texto);border:2px solid #e0eee5;font-weight:normal}.alternativa:hover{background:#e1f2e7}.alternativa.selecionada{border-color:var(--verde);background:#d9f2e2}.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.secundario{background:#e8f0eb;color:var(--escuro)}.secundario:hover{background:#d6e6db}.nota{font-size:3rem;font-weight:800;color:var(--verde);margin:10px 0}.gabarito{margin-top:26px}.item-gabarito{border:1px solid #dfe9e2;border-left:5px solid var(--verde);padding:16px;margin:12px 0;border-radius:9px;background:#fcfefd}.item-gabarito.errada{border-left-color:var(--vermelho);background:#fffafa}.status{font-weight:700;color:var(--verde)}.errada .status{color:var(--vermelho)}.item-gabarito p{margin:7px 0;line-height:1.5}footer{text-align:center;color:#62756a;padding:25px;font-size:.9rem}@media(max-width:600px){.painel{padding:20px}header h1{font-size:2rem}}
</style>
</head>
<body>
<header><h1>IFQuiz</h1><p>Plataforma de Simulados Escolares</p></header>
<main><section class="painel" id="conteudo"></section></main>
<footer>Projeto educacional • Hospedagem no Microsoft Azure</footer>

],

],

],

let disciplinaAtual="",indice=0,respostas=[];
const area=document.getElementById("conteudo");
function elemento(tag,texto,classe){const el=document.createElement(tag);if(texto!==undefined)el.textContent=texto;if(classe)el.className=classe;return el;}
function botao(texto,acao,classe){const b=elemento("button",texto,classe);b.addEventListener("click",acao);return b;}
function inicio(){area.replaceChildren();area.append(elemento("h2","Bem-vindo ao IFQuiz!"),elemento("p","Escolha uma disciplina e responda a 10 questões. Ao final, confira sua nota e o gabarito completo.","subtitulo"));const grade=elemento("div",undefined,"grade");Object.keys(banco).forEach(nome=>grade.append(botao(nome+" • 10 questões",()=>iniciar(nome),"materia")));area.append(grade);}
function iniciar(nome){disciplinaAtual=nome;indice=0;respostas=Array(banco[nome].length).fill(null);mostrar();}
function mostrar(){const questoes=banco[disciplinaAtual],q=questoes[indice];area.replaceChildren();area.append(elemento("p",disciplinaAtual+" • Questão "+(indice+1)+" de "+questoes.length,"progresso"));const barra=elemento("div",undefined,"barra"),preenchimento=elemento("div",undefined,"preenchimento");preenchimento.style.width=((indice+1)/questoes.length*100)+"%";barra.append(preenchimento);area.append(barra,elemento("h2",q[0]));q[1].forEach((alternativa,i)=>{const b=botao(String.fromCharCode(65+i)+") "+alternativa,()=>{respostas[indice]=i;mostrar();},"alternativa"+(respostas[indice]===i?" selecionada":""));area.append(b);});const acoes=elemento("div",undefined,"acoes");if(indice>0)acoes.append(botao("Voltar",()=>{indice--;mostrar()},"secundario"));acoes.append(botao(indice===questoes.length-1?"Finalizar simulado":"Próxima questão",()=>{if(respostas[indice]===null){alert("Selecione uma alternativa antes de continuar.");return;}if(indice<questoes.length-1){indice++;mostrar();}else{resultado();}}));area.append(acoes);}
function resultado(){const questoes=banco[disciplinaAtual],acertos=questoes.reduce((s,q,i)=>s+(respostas[i]===q[2]?1:0),0),porcentagem=Math.round(acertos/questoes.length*100);area.replaceChildren(elemento("h2","Resultado — "+disciplinaAtual),elemento("div",porcentagem+"%","nota"),elemento("p","Você acertou "+acertos+" de "+questoes.length+" questões."));const acoes=elemento("div",undefined,"acoes");acoes.append(botao("Refazer simulado",()=>iniciar(disciplinaAtual)),botao("Escolher outra disciplina",inicio,"secundario"));area.append(acoes,elemento("h2","Gabarito comentado por questão","gabarito"));questoes.forEach((q,i)=>{const acertou=respostas[i]===q[2],card=elemento("div",undefined,"item-gabarito"+(acertou?"":" errada"));card.append(elemento("p",(i+1)+". "+q[0]),elemento("p",acertou?"✓ Correta":"✗ Incorreta","status"),elemento("p","Sua resposta: "+String.fromCharCode(65+respostas[i])+") "+q[1][respostas[i]]),elemento("p","Resposta correta: "+String.fromCharCode(65+q[2])+") "+q[1][q[2]]));area.append(card);});}
inicio();
</script>
